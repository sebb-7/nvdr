name: Apply controller hold repeat patch

on:
  push:
    branches:
      - feat/controller-profiles-remote-control
    paths:
      - .github/workflows/controller-hold-repeat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/controller-profiles-remote-control

      - name: Apply narrow source patch and invariance tests
        shell: bash
        env:
          TEST_SOURCE_BASE64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          adapter_path = Path('ios/FarRelay/ControllerAdapter.swift')
          source = adapter_path.read_text()
          start_marker = '        let ownedByThisInput = orderedModifiers.allSatisfy {'
          end_marker = '        guard orderedModifiers.allSatisfy({ stickyModifierLeases[$0] == nil }) else {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Could not find sticky modifier replacement boundaries: start={start}, end={end}')

          new_lines = [
              '        let ownedLeases = orderedModifiers.compactMap {',
              '            stickyModifierLeases[$0]',
              '        }',
              '        let ownedByThisInput = ownedLeases.count == orderedModifiers.count &&',
              '            ownedLeases.allSatisfy { $0.ownerInput == input }',
              '',
              '        // A modifier armed from a physically held Action Layer belongs to',
              '        // that layer gesture. Re-activating the same action must never toggle',
              '        // those modifiers off; it only repeats the optional tap key. The',
              '        // layer release remains the single authoritative release boundary.',
              '        if ownedByThisInput,',
              '           let heldLayerID = layerEngine.physicallyHeldLayerID,',
              '           ownedLeases.allSatisfy({ $0.ownerLayerID == heldLayerID }) {',
              '            let held = heldModifierDescription(action.modifiers)',
              '            if let tapKey = action.tapKey, let route = ownedLeases.first?.route {',
              '                diagnostics.observeController(',
              '                    eventID: eventID,',
              '                    input: input,',
              '                    pressed: true,',
              '                    stage: "Sticky modifier: layer-owned repeat tap \\(tapKey.label)"',
              '                )',
              '                Task { @MainActor [router] in',
              '                    let key = RemoteKey.windowsVirtualKey(tapKey.virtualKey)',
              '                    _ = await router.route(',
              '                        .sendKeyTransition(key, pressed: true),',
              '                        via: route',
              '                    )',
              '                    _ = await router.route(',
              '                        .sendKeyTransition(key, pressed: false),',
              '                        via: route',
              '                    )',
              '                }',
              '                announce("\\(held) still held. \\(tapKey.label) tapped")',
              '            } else {',
              '                announce(',
              '                    "\\(held) remains held until \\(heldLayerID.capitalized) layer is released"',
              '                )',
              '            }',
              '            if settings.hapticFeedbackEnabled { controllerHaptics.play(.selection) }',
              '            return true',
              '        }',
              '',
              '        if ownedByThisInput {',
              '            let leases = orderedModifiers.compactMap {',
              '                stickyModifierLeases.removeValue(forKey: $0)',
              '            }',
              '            routeStickyModifierLeases(',
              '                leases,',
              '                pressed: false,',
              '                eventID: eventID,',
              '                input: input',
              '            )',
              '            announce("\\(heldModifierDescription(action.modifiers)) released")',
              '            if settings.hapticFeedbackEnabled { controllerHaptics.play(.selection) }',
              '            return true',
              '        }',
              '',
          ]
          source = source[:start] + '\n'.join(new_lines) + source[end:]
          adapter_path.write_text(source)

          test_source = base64.b64decode(os.environ['TEST_SOURCE_BASE64']).decode('utf-8')
          Path('ios/FarRelayTests/LayerHeldStickyModifierRepeatTests.swift').write_text(test_source)
          PY

      - name: Commit narrow patch
        shell: bash
        run: |
          git config user.name "FarRelay CI"
          git config user.email "actions@users.noreply.github.com"
          git add ios/FarRelay/ControllerAdapter.swift ios/FarRelayTests/LayerHeldStickyModifierRepeatTests.swift
          git diff --cached --check
          git commit -m "fix: repeat layer-owned sticky tap without release"
          git push origin HEAD:feat/controller-profiles-remote-control
