name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: macos-26
    env:
      APP_NAME: FarRelay
      BUNDLE_ID: com.sebb7.farrelay
      BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure temporary paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/farrelay-signing.keychain-db" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/FarRelay.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/FarRelay-export" >> "$GITHUB_ENV"

      - name: Select Apple toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate FarRelay project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project FarRelay.xcodeproj -scheme FarRelay

      # Keep distribution independent from the normal push/PR workflow while
      # still proving this exact source revision passes the existing test suite.
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run existing iOS tests before signing
        working-directory: ios
        run: >-
          xcodebuild test
          -project FarRelay.xcodeproj
          -scheme FarRelayTests
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Install distribution certificate and App Store profile
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID GitHub secret}"
          : "${CERTIFICATE_BASE64:?Missing APPLE_DISTRIBUTION_CERTIFICATE_BASE64 GitHub secret}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD GitHub secret}"
          : "${PROFILE_BASE64:?Missing APPLE_PROVISIONING_PROFILE_BASE64 GitHub secret}"

          certificate_path="$RUNNER_TEMP/farrelay-distribution.p12"
          profile_path="$RUNNER_TEMP/farrelay-app-store.mobileprovision"
          profile_plist="$RUNNER_TEMP/farrelay-profile.plist"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          test "$profile_team" = "$APPLE_TEAM_ID"
          test "$profile_app_id" = "$APPLE_TEAM_ID.$BUNDLE_ID"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"

      - name: Archive signed FarRelay Release
        working-directory: ios
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: >-
          xcodebuild archive
          -project FarRelay.xcodeproj
          -scheme FarRelay
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$ARCHIVE_PATH"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export App Store Connect IPA
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$export_options"
          test -f "$EXPORT_PATH/$APP_NAME.ipa"

      - name: Upload build to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID GitHub secret}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID GitHub secret}"
          : "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY GitHub secret}"

          api_key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$api_key_directory"
          printf '%s' "$ASC_PRIVATE_KEY" > "$api_key_directory/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$EXPORT_PATH/$APP_NAME.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/farrelay-distribution.p12"
          rm -f "$RUNNER_TEMP/farrelay-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/farrelay-profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
