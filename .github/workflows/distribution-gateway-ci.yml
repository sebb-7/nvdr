name: Distribution Gateway CI

on:
  push:
    paths:
      - "distribution-gateway/**"
      - ".github/workflows/distribution-gateway-ci.yml"
  pull_request:
    paths:
      - "distribution-gateway/**"
      - ".github/workflows/distribution-gateway-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distribution-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gateway tooling
        run: npm install --no-package-lock
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Validate Worker bundle and bindings
        run: npx wrangler deploy --dry-run
