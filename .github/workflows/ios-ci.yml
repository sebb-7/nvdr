name: iOS CI

on:
  push:
    branches:
      - feat/ssh-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Apple toolchain diagnostics
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Print XcodeGen version
        run: xcodegen version

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Nvdr.xcodeproj -scheme Nvdr

      - name: Build app for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project Nvdr.xcodeproj
          -scheme Nvdr
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $udid"

      - name: Run SSH foundation unit tests
        working-directory: ios
        run: >-
          xcodebuild test
          -project Nvdr.xcodeproj
          -scheme NvdrTests
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
