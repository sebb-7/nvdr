name: iOS CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Apple toolchain diagnostics
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Print XcodeGen version
        run: xcodegen version

      - name: Restore pinned Swift package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/FarRelaySourcePackages
          key: ios-source-packages-macos-26-${{ hashFiles('ios/project.yml', 'ios/FarRelay.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $udid"

      - name: Run authoritative iOS validation
        working-directory: ios
        run: >-
          xcodebuild test
          -project FarRelay.xcodeproj
          -scheme FarRelayTests
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/FarRelaySourcePackages"
          -resultBundlePath "$RUNNER_TEMP/FarRelayTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS test result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/FarRelayTests.xcresult
          if-no-files-found: warn
