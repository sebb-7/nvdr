name: FarRelay Host
on:
  push:
    paths: ["farrelay-host/**", ".github/workflows/farrelay-host.yml"]
  pull_request:
    paths: ["farrelay-host/**", ".github/workflows/farrelay-host.yml"]
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: farrelay-host } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
