name: Windows Distribution Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      gateway_url:
        description: HTTPS base URL of the authenticated FarRelay tester gateway, without trailing slash
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      CHANNEL: ${{ inputs.channel }}
      GATEWAY_URL: ${{ inputs.gateway_url }}
      DIST: windows/dist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Resolve and validate FarRelay version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+(?:\.\d+)+(?:-[A-Za-z0-9.-]+)?$') {
            throw "VERSION contains an invalid release version: $version"
          }
          foreach ($manifest in @("Cargo.toml", "farrelay-host/Cargo.toml", "farrelay-updater/Cargo.toml")) {
            $match = Select-String -Path $manifest -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "$manifest has no package version" }
            $manifestVersion = $match.Matches[0].Groups[1].Value
            if ($manifestVersion -ne $version) {
              throw "$manifest version $manifestVersion does not match VERSION $version"
            }
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate private distribution configuration
        shell: pwsh
        run: |
          if (-not $env:GATEWAY_URL.StartsWith("https://")) { throw "gateway_url must use HTTPS" }
          if ($env:GATEWAY_URL.EndsWith("/")) { throw "gateway_url must not end with a slash" }

      - name: Test FarRelay core
        run: cargo test --locked

      - name: Test FarRelay Host
        run: cargo test --locked --manifest-path farrelay-host/Cargo.toml

      - name: Test update policy and staging transaction
        run: cargo test --locked --manifest-path farrelay-updater/Cargo.toml

      - name: Parse Windows helper scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            "windows/release/Test-FarRelayTravelReadiness.ps1",
            "windows/release/Prepare-FarRelayTravel.ps1",
            "windows/release/Start-FarRelayControlCenter.ps1",
            "windows/installer/Install-FarRelayUpdaterTask.ps1",
            "windows/installer/Install-FarRelayShellLinks.ps1",
            "farrelay-host/scripts/Install-FarRelayNvdaRecoveryTask.ps1"
          )) {
            [void][scriptblock]::Create((Get-Content $script -Raw))
          }

      - name: Build distribution binaries
        shell: pwsh
        run: |
          $env:FARRELAY_DIST_VERSION = $env:VERSION
          cargo build --release --locked
          cargo build --release --locked --manifest-path farrelay-host/Cargo.toml
          cargo build --release --locked --manifest-path farrelay-updater/Cargo.toml
          New-Item -ItemType Directory -Force $env:DIST | Out-Null
          Copy-Item target/release/farrelay.exe $env:DIST
          Copy-Item farrelay-host/target/release/farrelay-host.exe $env:DIST
          Copy-Item farrelay-updater/target/release/farrelay-updater.exe $env:DIST

      - name: Verify binary versions
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $checks = @(
            @{ Path = "$env:DIST/farrelay.exe"; Expected = "farrelay $expected" },
            @{ Path = "$env:DIST/farrelay-host.exe"; Expected = "farrelay-host $expected" },
            @{ Path = "$env:DIST/farrelay-updater.exe"; Expected = "farrelay-updater $expected" }
          )
          foreach ($check in $checks) {
            $actual = (& $check.Path --version | Out-String).Trim()
            if ($actual -ne $check.Expected) {
              throw "$($check.Path) reported '$actual'; expected '$($check.Expected)'"
            }
          }

      - name: Build NVDA add-on
        shell: pwsh
        run: |
          Copy-Item addon addon-build -Recurse
          (Get-Content addon-build/manifest.ini) -replace '^version = .*$', "version = $env:VERSION" | Set-Content addon-build/manifest.ini
          $addon = Join-Path $env:DIST "FarRelayBridge-$env:VERSION.nvda-addon"
          Compress-Archive -Path addon-build/* -DestinationPath $addon -Force

      - name: Create updater payload and portable archive
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "farrelay-update-payload"
          Remove-Item $payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $payload "scripts") | Out-Null
          Copy-Item "$env:DIST/farrelay.exe" $payload
          Copy-Item "$env:DIST/farrelay-host.exe" $payload
          Copy-Item "$env:DIST/farrelay-updater.exe" $payload
          Copy-Item "farrelay-host/scripts/Install-FarRelayNvdaRecoveryTask.ps1" (Join-Path $payload "scripts")
          Copy-Item "windows/installer/Install-FarRelayUpdaterTask.ps1" (Join-Path $payload "scripts")
          Copy-Item "windows/installer/Install-FarRelayShellLinks.ps1" (Join-Path $payload "scripts")
          Copy-Item "windows/release/Prepare-FarRelayTravel.ps1" (Join-Path $payload "scripts")
          Copy-Item "windows/release/Start-FarRelayControlCenter.ps1" (Join-Path $payload "scripts")
          Copy-Item "windows/release/Test-FarRelayTravelReadiness.ps1" (Join-Path $payload "scripts")
          Compress-Archive -Path "$payload/*" -DestinationPath "$env:DIST/FarRelay-Windows-Update-$env:VERSION.zip" -Force
          Compress-Archive -Path "$env:DIST/farrelay.exe", "$env:DIST/farrelay-host.exe", "$env:DIST/farrelay-updater.exe", "$env:DIST/FarRelayBridge-$env:VERSION.nvda-addon" -DestinationPath "$env:DIST/FarRelay-Windows-Portable-$env:VERSION.zip" -Force

      - name: Write private-channel manifest and checksums
        shell: pwsh
        run: |
          $payload = Get-Item "$env:DIST/FarRelay-Windows-Update-$env:VERSION.zip"
          $hash = (Get-FileHash $payload.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetPath = "/v1/download/$env:VERSION/windows_x86_64"
          @{ schema_version = 1; channel = $env:CHANNEL; version = $env:VERSION; published_at = (Get-Date).ToUniversalTime().ToString('o'); assets = @{ windows_x86_64 = @{ archive_url = $assetPath; sha256 = $hash; size = $payload.Length } } } | ConvertTo-Json -Depth 5 | Set-Content "$env:DIST/update-$env:CHANNEL.json" -NoNewline
          Copy-Item "$env:DIST/update-$env:CHANNEL.json" "$env:DIST/update-manifest.json"
          Get-ChildItem "$env:DIST/*" -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), $_.Path.Split([IO.Path]::DirectorySeparatorChar)[-1] } | Set-Content "$env:DIST/SHA256SUMS.txt"

      - name: Build accessible Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          iscc "/DAppVersion=$env:VERSION" "/DChannel=$env:CHANNEL" "/DGatewayUrl=$env:GATEWAY_URL" windows/installer/FarRelay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "windows/output/FarRelay-Setup-$env:VERSION.exe" $env:DIST

      - uses: actions/upload-artifact@v4
        with:
          name: FarRelay-Windows-${{ steps.version.outputs.version }}
          path: windows/dist/*
          if-no-files-found: error
