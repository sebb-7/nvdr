name: Windows Updater CI

on:
  push:
    paths:
      - "VERSION"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "farrelay-host/**"
      - "farrelay-updater/**"
      - "windows/**"
      - ".github/workflows/windows-updater-ci.yml"
  pull_request:
    paths:
      - "VERSION"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "farrelay-host/**"
      - "farrelay-updater/**"
      - "windows/**"
      - ".github/workflows/windows-updater-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version source is synchronized
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          foreach ($manifest in @("Cargo.toml", "farrelay-host/Cargo.toml", "farrelay-updater/Cargo.toml")) {
            $match = Select-String -Path $manifest -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "$manifest has no package version" }
            $actual = $match.Matches[0].Groups[1].Value
            if ($actual -ne $expected) {
              throw "$manifest version $actual does not match VERSION $expected"
            }
          }

      - name: Test FarRelay core
        run: cargo test --locked

      - name: Test FarRelay Host
        run: cargo test --locked --manifest-path farrelay-host/Cargo.toml

      - name: Test updater
        run: cargo test --locked --manifest-path farrelay-updater/Cargo.toml

      - name: Clippy updater
        run: cargo clippy --locked --manifest-path farrelay-updater/Cargo.toml --all-targets -- -D warnings

      - name: Build all Windows distribution binaries
        shell: pwsh
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path farrelay-host/Cargo.toml
          cargo build --release --locked --manifest-path farrelay-updater/Cargo.toml

      - name: Verify local-build version output
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          $checks = @(
            @{ Path = ".\target\release\farrelay.exe"; Expected = "farrelay $expected" },
            @{ Path = ".\farrelay-host\target\release\farrelay-host.exe"; Expected = "farrelay-host $expected" },
            @{ Path = ".\farrelay-updater\target\release\farrelay-updater.exe"; Expected = "farrelay-updater $expected" }
          )
          foreach ($check in $checks) {
            $actual = (& $check.Path --version | Out-String).Trim()
            if ($actual -ne $check.Expected) {
              throw "$($check.Path) reported '$actual'; expected '$($check.Expected)'"
            }
          }

      - name: Parse travel-readiness script
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content windows/release/Test-FarRelayTravelReadiness.ps1 -Raw))

      - name: Prepare installer syntax fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/dist | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay-host.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay-updater.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/FarRelayBridge-0.0.0-test.nvda-addon | Out-Null

      - name: Compile Inno installer script
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          iscc "/DAppVersion=0.0.0-test" "/DChannel=beta" "/DGatewayUrl=https://example.workers.dev" windows/installer/FarRelay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
