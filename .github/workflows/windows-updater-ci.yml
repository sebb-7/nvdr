name: Windows Updater CI

on:
  push:
    paths:
      - "farrelay-updater/**"
      - "windows/installer/**"
      - ".github/workflows/windows-updater-ci.yml"
  pull_request:
    paths:
      - "farrelay-updater/**"
      - "windows/installer/**"
      - ".github/workflows/windows-updater-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test updater
        run: cargo test --locked --manifest-path farrelay-updater/Cargo.toml
      - name: Clippy updater
        run: cargo clippy --locked --manifest-path farrelay-updater/Cargo.toml --all-targets -- -D warnings
      - name: Prepare installer syntax fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/dist | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay-host.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/farrelay-updater.exe | Out-Null
          New-Item -ItemType File -Force windows/dist/FarRelayBridge-0.0.0-test.nvda-addon | Out-Null
      - name: Compile Inno installer script
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          iscc "/DAppVersion=0.0.0-test" "/DChannel=beta" "/DGatewayUrl=https://example.workers.dev" windows/installer/FarRelay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
