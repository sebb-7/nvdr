name: Tester Gateway CI

on:
  push:
    paths:
      - "distribution-gateway/**"
      - ".github/workflows/tester-gateway-ci.yml"
  pull_request:
    paths:
      - "distribution-gateway/**"
      - ".github/workflows/tester-gateway-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distribution-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
