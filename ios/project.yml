name: FarRelay
options:
  bundleIdPrefix: com.sebb7
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Release
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"
  SwiftTerm:
    url: https://github.com/sebb-7/SwiftTerm.git
    revision: "3a7f37e39d2c273f8fcba92c63c8a767a1e1e00d"

targets:
  FarRelay:
    type: application
    platform: iOS
    sources:
      - path: FarRelay
    info:
      path: FarRelay/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        CFBundleDisplayName: FarRelay
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FarRelaySourceRevision: "$(FARRELAY_SOURCE_REVISION)"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    dependencies:
      - package: Citadel
      - package: swift-crypto
        product: _CryptoExtras
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebb7.farrelay
        PRODUCT_NAME: FarRelay
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        FARRELAY_SOURCE_REVISION: "development"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "$(FARRELAY_TEAM_ID)"
          PROVISIONING_PROFILE_SPECIFIER: "$(FARRELAY_PROFILE_NAME)"
          OTHER_CODE_SIGN_FLAGS: "$(inherited) $(FARRELAY_OTHER_CODE_SIGN_FLAGS)"
          CURRENT_PROJECT_VERSION: "$(FARRELAY_BUILD_NUMBER)"

  FarRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FarRelayTests
    dependencies:
      - target: FarRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebb7.farrelay.tests
        GENERATE_INFOPLIST_FILE: YES
