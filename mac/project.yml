name: FarRelay
options:
  bundleIdPrefix: com.sebb7
  deploymentTarget:
    macOS: "26.0"
  defaultConfig: Release
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"

targets:
  FarRelay:
    type: application
    platform: macOS
    sources:
      - path: FarRelay
    info:
      path: FarRelay/Info.plist
      properties:
        CFBundleDisplayName: FarRelay
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "FarRelay"
        # Shown in the Input Monitoring permission prompt — FarRelay reads
        # Caps Lock and the function row straight off the HID layer for
        # reliable remote input forwarding.
        NSInputMonitoringUsageDescription: "FarRelay reads Caps Lock and function keys at the hardware level so it can reliably forward them to the remote computer."
    dependencies:
      - package: Citadel
      - package: swift-crypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebb7.farrelay
        PRODUCT_NAME: FarRelay
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Developer ID / direct distribution: not sandboxed (a global event
        # tap that swallows keystrokes is incompatible with App Sandbox), but
        # hardened runtime is on so the build can be notarized.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic

  FarRelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FarRelayTests
    dependencies:
      - target: FarRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebb7.farrelay.tests
        GENERATE_INFOPLIST_FILE: YES
